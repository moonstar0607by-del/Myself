<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="Mydemo" content="width=device-width, initial-scale=1.0">
  <title>信息提交表单</title>

  <style>
    /* ---------- 简单美化 ---------- */
    /* 让表单居中显示，背景灰色 */
  body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 40px;
  }

  form {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 360px;
  }

   .field {
      margin-bottom: 18px;
  }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .option label {
      display: inline;
      font-weight: normal;
    }

    textarea {
      resize: vertical;
      /* 只允许上下拉伸 */
    }

    button {
      width: 100%;
      padding: 10px;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #3a7bc0;
    }
    button:disabled { background: #aaa; cursor: not-allowed; }

    /* 字段必填时的红色星号提示 */
    .required::after {
      content: " *";
      color: red;
    }

    /* 提交结果的提示区域 */
    #result {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      display: none;   /* 默认隐藏 */
      font-size: 14px;
    }
    #result.success { display: block; background: #e6f7e6; color: #2d7a2d; }
    #result.error   { display: block; background: #fdeaea; color: #c0392b; }

  </style>
</head>

<body>

  <form id="myForm" action="/submit" method="post" onsubmit="return validateForm()">

    <h2>信息提交</h2>

    <!-- 字段1：title（标题，单行文本，必填，限长20字） -->
    <div class="field">
      <label for="title" class="required">标题</label>
      <input type="text" id="title" name="title"
             placeholder="请输入标题（不超过20字）"
             maxlength="20" required>
    </div>

    <!-- 字段2：content（内容，多行文本，必填） -->
    <div class="field">
      <label for="content" class="required">内容</label>
      <textarea id="content" name="content" rows="4"
                placeholder="请输入详细内容（至少10个字）"
                minlength="10" required></textarea>
    </div>

    <!-- 字段3：level（等级，下拉框） -->
    <div class="field">
      <label for="level" class="required">等级</label>
      <select id="level" name="level" required>
        <option value="">-- 请选择 --</option>
        <option value="info">信息</option>
        <option value="warn">警告</option>
        <option value="error">错误</option>
      </select>
    </div>

    <!-- 字段4：category（分类，单选按钮） -->
    <div class="field">
      <label class="required">分类</label>
      <label class="option">
        <input type="radio" name="category" value="bug" checked> 问题反馈
      </label>
      <label class="option">
        <input type="radio" name="category" value="suggestion"> 功能建议
      </label>
      <label class="option">
        <input type="radio" name="category" value="other"> 其他
      </label>
    </div>

    <!-- 字段5：email（邮箱，自动校验格式） -->
    <div class="field">
      <label for="email">邮箱（选填）</label>
      <input type="email" id="email" name="email"
             placeholder="example@mail.com">
    </div>

    <!-- 字段6：deadline（日期选择器） -->
    <div class="field">
      <label for="deadline">期望完成日期</label>
      <input type="date" id="deadline" name="deadline">
    </div>

    <!-- 字段7：agree（同意协议，复选框，必须勾选） -->
    <div class="field">
      <label class="option">
        <input type="checkbox" name="agree" required>
        我已阅读并同意相关条款
      </label>
    </div>

    <button type="submit" id="submitBtn">提 交</button>

    <!-- 提交结果显示在这里 -->
    <div id="result"></div>

  </form>

  <script type="module" src="./dist/submit.js"></script>

</body>


</html>
