<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="Mydemo" content="width=device-width, initial-scale=1.0">
  <title>信息提交表单</title>

  <style>
    /* ---------- 简单美化 ---------- */
  body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 40px;
  }

  form {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 360px;
  }

   .field {
      margin-bottom: 18px;
  }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .option label {
      display: inline;
      font-weight: normal;
    }

    textarea {
      resize: vertical;
      /* 只允许上下拉伸 */
    }

    button {
      width: 100%;
      padding: 10px;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #3a7bc0;
    }
    button:disabled { background: #aaa; cursor: not-allowed; }

    /* 字段必填时的红色星号提示 */
    .required::after {
      content: " *";
      color: red;
    }

    /* 提交结果的提示区域 */
    #result {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      display: none;   /* 默认隐藏 */
      font-size: 14px;
    }
    #result.success { display: block; background: #e6f7e6; color: #2d7a2d; }
    #result.error   { display: block; background: #fdeaea; color: #c0392b; }

  </style>
</head>

<body>

  <form id="myForm" action="/submit" method="post" onsubmit="return validateForm()">

    <h2>信息提交</h2>

    <!-- 字段1：title（标题，单行文本，必填，限长20字） -->
    <div class="field">
      <label for="title" class="required">标题</label>
      <input type="text" id="title" name="title"
             placeholder="请输入标题（不超过20字）"
             maxlength="20" required>
    </div>

    <!-- 字段2：content（内容，多行文本，必填） -->
    <div class="field">
      <label for="content" class="required">内容</label>
      <textarea id="content" name="content" rows="4"
                placeholder="请输入详细内容（至少10个字）"
                minlength="10" required></textarea>
    </div>

    <!-- 字段3：level（等级，下拉框） -->
    <div class="field">
      <label for="level" class="required">等级</label>
      <select id="level" name="level" required>
        <option value="">-- 请选择 --</option>
        <option value="low">低</option>
        <option value="medium">中</option>
        <option value="high">高</option>
      </select>
    </div>

    <!-- 字段4：category（分类，单选按钮） -->
    <div class="field">
      <label class="required">分类</label>
      <label class="option">
        <input type="radio" name="category" value="bug" checked> 问题反馈
      </label>
      <label class="option">
        <input type="radio" name="category" value="suggestion"> 功能建议
      </label>
      <label class="option">
        <input type="radio" name="category" value="other"> 其他
      </label>
    </div>

    <!-- 字段5：email（邮箱，自动校验格式） -->
    <div class="field">
      <label for="email">邮箱（选填）</label>
      <input type="email" id="email" name="email"
             placeholder="example@mail.com">
    </div>

    <!-- 字段6：deadline（日期选择器） -->
    <div class="field">
      <label for="deadline">期望完成日期</label>
      <input type="date" id="deadline" name="deadline">
    </div>

    <!-- 字段7：agree（同意协议，复选框，必须勾选） -->
    <div class="field">
      <label class="option">
        <input type="checkbox" name="agree" required>
        我已阅读并同意相关条款
      </label>
    </div>

    <button type="submit" id="submitBtn">提 交</button>

    <!-- 提交结果显示在这里 -->
    <div id="result"></div>

  </form>

  <script>
    // 获取表单元素
    const form = document.getElementById("myForm");
    const submitBtn = document.getElementById("submitBtn");
    const resultBox = document.getElementById("result");

    // 监听表单的 submit 事件（比 onsubmit 属性写法更现代）
    form.addEventListener("submit", function (e) {

      // ★ 核心：阻止默认提交行为，页面不会跳转刷新
      e.preventDefault();

      // HTML5 校验（required 等）已经通过才会走到这里
      // 再做一次自定义校验
      const content = form.content.value.trim();
      if (content.length < 10) {
        showResult("内容至少需要10个字！", false);
        return;
      }

      // 提交期间禁用按钮，防止重复点击
      submitBtn.disabled = true;
      submitBtn.textContent = "提交中...";
      resultBox.className = "";
      resultBox.style.display = "none";

      // ★ 核心：用 fetch 手动发请求
      fetch("/submit", {
        method: "POST",              // 请求方法
        body: new FormData(form)     // 自动打包表单所有字段
      })
        .then(function (response) {
          // response：服务器的响应对象
          if (!response.ok) {
            // ok 为 false 表示状态码不是 2xx，比如 404、500
            throw new Error("服务器返回错误：" + response.status);
          }
          return response.json();    // 把响应解析成 JSON 对象
        })
        .then(function (data) {
          // data：上一步解析出来的 JSON
          showResult("✅ 提交成功！服务器说：" + data.message, true);
          form.reset();              // 清空表单
        })
        .catch(function (error) {
          // 网络不通、服务器不存在、解析失败都会进这里
          showResult("❌ 提交失败：" + error.message, false);
        })
        .finally(function () {
          // 无论成功失败，都恢复按钮
          submitBtn.disabled = false;
          submitBtn.textContent = "提 交";
        });
    });

    // 显示结果的小工具函数
    function showResult(message, isSuccess) {
      resultBox.textContent = message;
      resultBox.className = isSuccess ? "success" : "error";
    }
  </script>

</body>


</html>
